        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
        - BF123: BF123
      attribute_count: S
      partner_id: '0031'
