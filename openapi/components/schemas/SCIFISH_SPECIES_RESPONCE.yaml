title: SCIFISH_SPECIES
description: >-
  Provides a list of scifish species using the p_listname parameter (e.g.
  "p_listname":"SCIFISH_SPECIES")
type: object
properties:
  row:
    type: array
    items:
      type: object
      properties:
        code:
          description: ITIS code of species.
          type: string
        description:
          description: common name of species.
          type: string
        in_use:
          type: string
  status:
    description: status of the request
    enum:
      - OK
      - FAIL
    type: string
  description:
    description: human readable description of the status of request
    type: string
example:
  row:
    - code: 81763
      description: PROPELLERCLAM, NORTHERN
      in_use: 'Y'
  status: OK
  description: 1003 Species(s) Returned.
